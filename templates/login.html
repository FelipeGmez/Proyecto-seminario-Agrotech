<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AGROTECH - Iniciar sesión</title>


<style>
:root{--v1:#e8f5e9;--v2:#66bb6a;--v3:#2e7d32;--v4:#1b5e20;--v5:#14401a}
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(160deg,var(--v3),var(--v4) 60%,var(--v5));display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}

.login-container{background:#fff;padding:35px;width:100%;max-width:350px;border-radius:14px;border-top:5px solid var(--v2);box-shadow:0 10px 30px rgba(0,0,0,.30)}

.marca{text-align:center;margin-bottom:20px}
.marca .hoja{font-size:40px;margin-bottom:6px}
.marca h1{margin:0 0 6px;font-size:26px;letter-spacing:2px;color:var(--v4)}
.marca p{margin:0;font-size:13px;color:#5f7a63}

h2{text-align:center;margin:0 0 5px;font-size:18px;color:#2b3a2e}

label{display:block;margin-top:15px;margin-bottom:5px;color:#2b3a2e;font-size:14px}

input{width:100%;padding:10px;border:1px solid #c5d6c7;border-radius:6px;font-size:14px;transition:.2s}
input:focus{outline:none;border-color:var(--v3);box-shadow:0 0 0 3px rgba(102,187,106,.30)}

button{width:100%;margin-top:25px;padding:11px;border:none;border-radius:6px;background:var(--v4);color:#fff;font-size:15px;cursor:pointer;transition:.2s}
button:hover{background:var(--v5)}
button:disabled{background:#8fae93;cursor:not-allowed}

.error{color:#b91c1c;text-align:center;margin-top:15px}
.success{color:var(--v3);text-align:center;margin-top:15px;font-weight:bold}
</style>

</head>

<body>

<div class="login-container">


    <div class="marca">
        <div class="hoja">🌱</div>
        <h1>AGROTECH</h1>
        <p>Monitoreo inteligente de cultivos</p>
    </div>

    <h2>Iniciar sesión</h2>


    <form id="loginForm">


        <label for="usuario">
            Usuario
        </label>


        <input
            type="text"
            id="usuario"
            name="usuario"
            autocomplete="username"
            required
        >


        <label for="password">
            Contraseña
        </label>


        <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
        >


        <button type="submit" id="botonIngresar">
            Ingresar
        </button>


    </form>


    <div id="mensaje"></div>


</div>


<script>

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const usuario =
                document.getElementById("usuario").value;

            const password =
                document.getElementById("password").value;

            const mensaje =
                document.getElementById("mensaje");

            const boton =
                document.getElementById("botonIngresar");


            mensaje.className = "";
            mensaje.textContent = "Iniciando sesión...";
            boton.disabled = true;


            try {

                const respuesta = await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            usuario: usuario,
                            password: password
                        })
                    }
                );


                const datos = await respuesta.json();


                // Se usa datos.ok en lugar de comparar el texto
                // del mensaje, que puede cambiar en el servidor.
                if (datos.ok) {

                    mensaje.className = "success";

                    mensaje.textContent =
                        "Inicio de sesión correcto";


                    setTimeout(function() {

                        window.location.href =
                            "/dashboard";

                    }, 300);

                }
                else {

                    mensaje.className = "error";

                    mensaje.textContent =
                        datos.mensaje || "No se pudo iniciar sesión.";

                    boton.disabled = false;

                }


            }
            catch (error) {

                mensaje.className = "error";

                mensaje.textContent =
                    "No se pudo conectar con la API.";

                boton.disabled = false;

                console.error(error);

            }

        });

</script>


</body>

</html>
